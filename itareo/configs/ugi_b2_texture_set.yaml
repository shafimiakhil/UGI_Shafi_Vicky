# B2 texture set (CLAUDE.md 13.1, 13.2; Shafi's decision of 2 Nov 2026, late night). Definition only, no run yet.
# Rule: one feature per physical family, kept by its gain over NDVI + CHM (texture screen,
# docs/evidence_phase2/texture_screen/auroc.csv; training-fold AUROC, oriented). Texture is computed in the data loader
# from the stored inputs; the implementations are those of scripts/u04_texture_screen.py (functions named below).
features:
  - name: ndvi_glcmcorr_41m        # family spatial_stats_ndvi; AUROC min 0.657, mean 0.680; spatial_stats() on Neo NDVI
    input: derived/features/neo2022_indices_grid1m.tif (band 1)
    window_m: 41
  - name: ndvi_orientcons_41m      # family linearity; AUROC min 0.570, mean 0.588; structure_feats() on Neo NDVI
    input: derived/features/neo2022_indices_grid1m.tif (band 1)
    window_m: 41
  - name: csk_gistar_41m           # family spatial_stats_csk; AUROC min 0.606, mean 0.632 (lower in UGI); spatial_stats() on CSK dB
    input: derived/features/csk_20250728_localstats_2p5m.tif (band 1), native 2.5 m
    window_px: 17
  - name: csk_cv_41m               # family radar_heterogeneity; AUROC min 0.501, mean 0.554; gain over NDVI 0.104 (pass_b)
    input: work/raw_data/CSK/CSKS2_GTC_B_HI_04_HH_RA_SF_20250728103626_20250728103634.S01.SBI.tif, native 2.5 m
    window_px: 17
  - name: pan_lawn                 # lawn homogeneity, CLAUDE.md 13.2: var3, var9, hom3, hom9 (vegetated pixels only)
    input: derived/features/neo2022_pan_lawn_grid1m.tif (4 bands, float16)
moved_to_B3_height_family: [tree_frac_41m, tree_acf5_41m]   # they change sign by group (auroc_by_group.csv)
