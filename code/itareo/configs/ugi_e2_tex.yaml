# E2 (CLAUDE.md 13.6): ugi_r1_none plus optical texture in the stem at 1 m (itareo/ugi_seg/tex_branch.py). Nothing else differs.
# Stage R, R1 (CLAUDE.md 13.3): A1 (ImageNet start) on the v3 mosaic, 60 epochs, edge_band = none.
# both = the 1 m band ignored on both sides of every boundary (the A1/A2 round); outer = only band pixels outside the
# inventory ignored; none = no band. Validation on all valid pixels; rules 1 and 4 for every run. Paths relative to work_ms/.
name: ugi_e2_tex
paths:
  image: derived/pneo2022_registered_v3/pneo2022_toa_grid1m.tif
  labels: derived/ugi_labels
  polygons: derived/ugi_labels/polygons.csv
  tiles: derived/ugi_tiles/tiles.csv
  cache: runs_itareo/ugi/cache/neo2022_registered_v3
  ndvi: derived/features/neo2022_v3_indices_grid1m.tif
  sid: derived/pneo2022_registered_v3/pneo2022_strip_id_grid1m.tif
  pan_lawn: derived/features/neo2022_v3_pan_lawn_grid1m.tif
  ndvi_texture: derived/features/neo2022_v3_ndvi_texture_grid1m.tif
  tex_cache: runs_itareo/ugi/cache/tex_neo2022_v3
  runs: runs_itareo/ugi
model: {init: imagenet, texture: {log1p: [var3, var9]}}
folds: {x_line: 388282.5, y_line: 6525025.5}
tiles: {min_neo: 0.5}
internal_val: {block_m: 2048, frac: 0.15, seed: 1000, buffer_m: 128}
train:
  epochs: 60
  edge_band: none
  batch: 8
  lr: 3.0e-4
  wd: 1.0e-4
  workers: 4
  photometric: {global: [0.9, 1.1], per_band: 0.03}
eval: {window: 512, band_rows: 2048}
