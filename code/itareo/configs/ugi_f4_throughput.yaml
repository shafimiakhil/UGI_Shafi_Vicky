# Stage F, F4 (CLAUDE.md 13.3): throughput test, 3 epochs, one job alone and then two at once. Uses the v1 mosaic and its
# cache (v3 is not built: F1 stopped); throughput does not depend on the mosaic version (same tiles, bands and sizes).
# Also the first end-to-end run of train.py with rules 1 and 4 (prob_oof.tif, score.py). Paths relative to work_ms/.
name: ugi_f4_throughput
paths:
  image: derived/pneo2022_registered/pneo2022_toa_grid1m.tif
  labels: derived/ugi_labels
  polygons: derived/ugi_labels/polygons.csv
  tiles: derived/ugi_tiles/tiles.csv
  cache: runs_itareo/ugi/cache/neo2022_registered
  ndvi: derived/features/neo2022_indices_grid1m.tif
  sid: derived/pneo2022_registered/pneo2022_strip_id_grid1m.tif
  runs: runs_itareo/ugi
model: {init: imagenet}
folds: {x_line: 388282.5, y_line: 6525025.5}
tiles: {min_neo: 0.5}
internal_val: {block_m: 2048, frac: 0.15, seed: 1000, buffer_m: 128}
train:
  epochs: 3
  edge_band: both
  batch: 8
  lr: 3.0e-4
  wd: 1.0e-4
  workers: 4
  photometric: {global: [0.9, 1.1], per_band: 0.03}
eval: {window: 512, band_rows: 2048}
