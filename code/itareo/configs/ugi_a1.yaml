# UGI segmentation A1 (design note, family A): U-Net on the six Neo 2022 bands, encoder from ImageNet weights.
# Binary UGI head + type-group head; 1 m edge band ignored; background = certain negative. Paths relative to work_ms/.
name: ugi_a1
paths:
  image: derived/pneo2022_registered/pneo2022_toa_grid1m.tif
  labels: derived/ugi_labels
  polygons: derived/ugi_labels/polygons.csv
  tiles: derived/ugi_tiles/tiles.csv
  cache: runs_itareo/ugi/cache/neo2022_registered
  runs: runs_itareo/ugi
model: {init: imagenet}
folds: {x_line: 388282.5, y_line: 6525025.5}
tiles: {min_neo: 0.5}
internal_val: {block_m: 2048, frac: 0.15, seed: 1000, buffer_m: 128}
train:
  epochs: 30
  batch: 8
  lr: 3.0e-4
  wd: 1.0e-4
  workers: 4
  photometric: {global: [0.9, 1.1], per_band: 0.03}
eval: {window: 512, band_rows: 2048}
