# D1 L1a main configuration (CLAUDE.md 12.3): harmonised corrected Pléiades 2017 (A5 + B1b), GEOBIA 2017 labels,
# boundary band ignored in the loss. Paths relative to work_ms/. Run: python -m itareo.unet_ugi.train --cfg <this> ...
name: d1_l1a_main
paths:
  image: derived/pleiades2017/pleiades2017_toa_hpf_grid1m_harmonised.tif
  labels: derived/geobia2017/geobia2017_grid1m.tif
  strips: derived/pleiades2017/pleiades2017_strip_id_grid1m.tif
  tiles: runs_itareo/d1_l1a/tiles/tiles.csv
  cache: runs_itareo/d1_l1a/cache/corrected_harmonised
  runs: runs_itareo/d1_l1a
grid_res: 1.0
classes: [Trees, Low vegetation, Water, Buildings, Asphalt, Bare soil, Shadows]
strip_names: {0: edge_no_strip_id, 1: west, 2: east}
folds: {x_line: 388282.5, y_line: 6525025.5}      # Luigi's quadrant lines (itareo.patches.luigi_quadrant_lines), EPSG:32720
tiles: {size: 512, stride: 512, min_share: 0.5, cache_min_share: 0.3}
internal_val: {block_m: 2048, frac: 0.15, seed: 1000, buffer_m: 128}
train:
  epochs: 40
  batch: 8
  lr: 3.0e-4
  wd: 1.0e-4
  dice_weight: 1.0
  ignore_band: true
  workers: 4
  photometric: {global: [0.9, 1.1], per_band: 0.03}
eval: {window: 512, band_rows: 2048}
